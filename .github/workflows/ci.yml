name: CI/CD

# Every push and pull request: lint, Python tests on SQLite and PostgreSQL with a coverage gate, frontend tests and
# build, then the Docker image is built, started, smoke-tested and driven by the browser E2E suite.
# A push to main that passes all of that is deployed to Render and checked on the live site.

on:
  push:
    branches: [main]   # other branches are tested through their pull request, so each change runs once
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  python:
    name: Python tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: negotiator
          POSTGRES_PASSWORD: negotiator
          POSTGRES_DB: negotiator
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U negotiator" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # empty on the sqlite leg: every test then uses its own SQLite file
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://negotiator:negotiator@localhost:5432/negotiator' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest pytest-asyncio pytest-cov
          pip install --no-deps --ignore-requires-python lyzr-automata==0.1.3
      - name: Install OPA (enables the Rego cross-check tests)
        run: |
          curl -sSL -o /usr/local/bin/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x /usr/local/bin/opa
          opa version
      - name: Run tests with coverage (offline - no Lyzr credentials in CI)
        run: python -m pytest -rs --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: Coverage summary
        if: always()
        run: |
          echo "### Python coverage (${{ matrix.database }})" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && matrix.database == 'sqlite'
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests with coverage (thresholds in vite.config.ts)
        run: npm run coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;console.log('### Frontend coverage\n\n| Lines | Statements | Functions | Branches |\n|---|---|---|---|\n| '+[t.lines,t.statements,t.functions,t.branches].map(x=>x.pct+'%').join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY" || true
      - run: npm run build   # strict type-check (tests included) + production bundle

  container:
    name: Container build, smoke test and browser E2E
    needs: [lint, python, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hidevs-b2b-negotiator:ci .
      - name: Start the container (on a host-assigned port, the way Render runs it)
        run: >-
          docker run -d --name negotiator -p 8000:10000 -e PORT=10000
          -e TELEMETRY_WEBHOOK_SECRET=ci-only-secret -e GIT_COMMIT=${{ github.sha }} hidevs-b2b-negotiator:ci
      - name: Smoke-test the running app
        run: |
          base=http://127.0.0.1:8000
          for i in $(seq 1 30); do curl -fsS $base/api/health && break; sleep 2; done
          curl -fsS $base/api/health | jq -e --arg sha "${{ github.sha }}" '.status == "ok" and .commit == $sha'
          curl -fsS $base/api/status | jq -e '.database == "sqlite"'
          curl -fsS $base/ | grep -q '<div id="root">'   # the built UI is served

          # one full offline negotiation: red-team attacks, agreement, signed contract, PDF
          run=$(curl -fsS -X POST $base/api/negotiations -H 'Content-Type: application/json' \
            -d '{"scenario_id":"semiconductor_spot_po","llm_mode":"offline","red_team":true,"speed_ms":0,"wait":true}')
          echo "$run" | jq '{status, contract_id}'
          test "$(echo "$run" | jq -r .status)" = agreement
          contract=$(echo "$run" | jq -r .contract_id)
          curl -fsS -X POST $base/api/contracts/$contract/verify | jq -e '.valid and .fully_executed'
          curl -fsS -o contract.pdf $base/api/contracts/$contract/pdf
          head -c 5 contract.pdf | grep -q '%PDF-'

          # Docker's own HEALTHCHECK should report healthy too
          for i in $(seq 1 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' negotiator)
            [ "$status" != starting ] && break
            sleep 3
          done
          echo "container health: $status"
          test "$status" = healthy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Browser E2E against the container (Playwright + Chromium)
        run: |
          pip install "playwright>=1.45"
          python -m playwright install --with-deps chromium
          python scripts/e2e_ui.py --base http://127.0.0.1:8000 --out e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
      - name: Container logs
        if: always()
        run: docker logs negotiator

  deploy:
    name: Deploy to Render
    needs: [container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.LIVE_URL || 'https://hidevs-project.onrender.com' }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      LIVE_URL: ${{ vars.LIVE_URL || 'https://hidevs-project.onrender.com' }}
    steps:
      - name: Not configured yet
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::Add the RENDER_DEPLOY_HOOK_URL secret to deploy from CI (see README, Hosting it on Render)."
      - name: Trigger the deploy and wait until this commit is live
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          before=$(curl -fsS -m 120 "$LIVE_URL/api/health" | jq -r '.started_at // empty' || true)
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "deploy triggered for $GITHUB_SHA"
          for i in $(seq 1 90); do   # Render's free plan builds slowly; allow up to ~25 minutes
            health=$(curl -fsS -m 30 "$LIVE_URL/api/health" || true)
            commit=$(echo "$health" | jq -r '.commit // empty' 2>/dev/null || true)
            started=$(echo "$health" | jq -r '.started_at // empty' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ] || { [ -z "$commit" ] && [ -n "$started" ] && [ "$started" != "$before" ]; }; then
              echo "live: commit=${commit:-unreported} started_at=$started"; exit 0
            fi
            echo "waiting (live commit: ${commit:-unknown})"; sleep 15
          done
          echo "::error::$GITHUB_SHA did not go live in time"; exit 1
      - name: Smoke-test the live site
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS "$LIVE_URL/api/health" | jq -e '.status == "ok"'
          curl -fsS "$LIVE_URL/api/status" | jq -e '.database and .lyzr'
          curl -fsS "$LIVE_URL/api/scenarios" | jq -e 'length == 4'
          curl -fsS "$LIVE_URL/" | grep -q '<div id="root">'
          echo "### Deployed $GITHUB_SHA to $LIVE_URL" >> "$GITHUB_STEP_SUMMARY"
